name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Asset name convention: ikk-{os}-{arch}.{ext} — matches score_asset() in
    # ikk-core/src/platform.rs (self-update picks the asset by this name).
    env:
      ASSET_NAME: ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ikk-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ikk-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ikk-darwin-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ikk-darwin-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ikk-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf $ASSET_NAME ikk
          sha256sum $ASSET_NAME > SHA256SUMS.part

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a $env:ASSET_NAME ikk.exe
          Write-Host "$(Get-FileHash $env:ASSET_NAME -Algorithm SHA256).Hash.ToLower()  $env:ASSET_NAME" | Out-File -Encoding ascii SHA256SUMS.part

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ikk-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ikk-*
            target/${{ matrix.target }}/release/SHA256SUMS.part

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # Combine the per-platform hash lines into one SHA256SUMS file, which
      # `ikk self-update` verifies against (`<hash>  <name>` format).
      - name: Build SHA256SUMS
        run: |
          cat artifacts/*/SHA256SUMS.part | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # GitHub rejects zero-byte release assets; fail fast here instead.
          test -s SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            SHA256SUMS
          generate_release_notes: true

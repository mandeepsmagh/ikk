name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Asset name convention: ikk-{os}-{arch}.{ext} — matches score_asset() in
    # ikk-core/src/platform.rs (self-update picks the asset by this name).
    env:
      ASSET_NAME: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ikk-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ikk-linux-aarch64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ikk-darwin-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ikk-darwin-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ikk-windows-x86_64.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: ikk-windows-arm64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          strip ikk || true
          tar czf "$ASSET_NAME" ikk
          sha256sum "$ASSET_NAME" > "$ASSET_NAME.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a $env:ASSET_NAME ikk.exe
          $hash = (Get-FileHash $env:ASSET_NAME -Algorithm SHA256).Hash.ToLower()
          Write-Output "$hash  $env:ASSET_NAME" | Out-File -Encoding ascii "$env:ASSET_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ikk-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/ikk-*
            target/${{ matrix.target }}/release/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ikk-*
          merge-multiple: true

      # Combine the per-platform hash lines into one SHA256SUMS file, which
      # `ikk self-update` verifies against (`<hash>  <name>` format).
      - name: Build SHA256SUMS
        run: |
          cat artifacts/*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # GitHub rejects zero-byte release assets; fail fast here instead.
          test -s SHA256SUMS
          # sanity check: one line per built asset
          test "$(wc -l < SHA256SUMS)" -eq 6

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

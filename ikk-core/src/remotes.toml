# Built-in remote definitions — compiled into ikk binary.
# Users can override or extend in ~/.ikk/ikk.toml [[remotes]] sections.
# Add a new forge host by adding an entry here or in user config.
# No code changes required.

[[remotes]]
host                  = "github.com"
releases_url          = "https://api.github.com/repos/{owner}/{repo}/releases/latest"
releases_version_url  = "https://api.github.com/repos/{owner}/{repo}/releases/tags/{version}"
version_path          = "tag_name"
prerelease_path       = "prerelease"
draft_path            = "draft"
assets_path           = "assets"
asset_url_path        = "browser_download_url"
asset_name_path       = "name"
published_at_path     = "published_at"
auth_env              = "GITHUB_TOKEN"

[[remotes]]
host                  = "gitlab.com"
releases_url          = "https://gitlab.com/api/v4/projects/{owner}%2F{repo}/releases"
version_path          = "tag_name"
prerelease_path       = "upcoming_release"
draft_path            = ""
assets_path           = "assets.links"
asset_url_path        = "url"
asset_name_path       = "name"
published_at_path     = "released_at"
auth_env              = "GITLAB_TOKEN"

